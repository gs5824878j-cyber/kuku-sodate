<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="robots" content="noindex"><title>九九そだて 記録の保存と復元</title><style>body{font:17px/1.8 system-ui;max-width:680px;margin:40px auto;padding:20px;color:#234c3b}button,input{font:inherit;margin:12px 0}button{padding:12px}#message{white-space:pre-wrap;background:#eef5ef;padding:16px}</style></head><body><h1>九九そだて 記録の保存と復元</h1><p>旧サイトで使った端末とブラウザで記録を保存し、新サイトで同じファイルを復元します。記録は端末内で処理し、運営者へ送信しません。</p><p>他の九九画面を閉じて操作してください。ブログ内の九九も同じ保存領域を使う場合があります。移行後は新サイトで学習し、新旧を並行して更新しないでください。</p><button id="export">このブラウザの記録を保存</button><hr><label>復元するJSONファイル <input id="file" type="file" accept="application/json,.json"></label><p><label><input id="ack" type="checkbox">内容を確認し、既存記録がある場合は退避ファイルが保存できたことを確認しました</label></p><button id="restore" disabled>確認した記録で復元する</button><p id="message" role="status" aria-live="polite"></p><p><a href="./">九九そだてに戻る</a> · by FOREMIRA</p><script src="migration.js?v=2"></script></body></html>
